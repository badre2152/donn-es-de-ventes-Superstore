name: Repository security checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  secrets-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tracked configuration files
        run: python -m unittest discover -s tests -v
